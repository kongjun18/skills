# Default configuration for pull-recent-papers.
#
# On first launch the skill copies this file (optionally customized) to
# ${XDG_CONFIG_HOME:-~/.config}/agent-skills/pull-recent-papers/config.toml,
# and every later run reads that copy. Edit the user copy, not this file.
#
# Regex patterns use TOML literal strings ('...') so backslashes stay literal.
# They are matched case-insensitively against title + abstract.

[digest]
title = "arXiv Systems Digest"
# Primary field the digest serves; used to judge relevance during curation.
field = "computer systems"
# arXiv categories to query. A paper is kept only if its *primary* category is
# one of these (cross-lists from other fields are dropped).
categories = ["cs.DB", "cs.OS", "cs.DC", "cs.AR", "cs.PF"]
# Optional high-volume neighbors pulled for only a few topics: a paper whose
# primary category is a key here is kept only if it lands in one of the listed
# topics. Each key must also be in `categories`. Example:
#   strict_categories = { "cs.LG" = ["ML systems"] }
strict_categories = {}
days = 7
# Results pulled from the combined query, newest first; raise it when adding
# categories so the window isn't truncated.
max_results = 600

[reader]
# Optional free-form Markdown briefing (background, interests, current work,
# resources), relative to this config file's directory. When unset or missing,
# the user-profile skill's profile.md is used if it exists, else context.md
# next to this file.
# context_file = "my-context.md"
# Short interest phrases, only for readers with no context file. When a reader
# context exists, it is the source of interests and this list is ignored.
# Used to flag connections, not to filter.
interests = []
# Names the reader publishes under, to recognize their own papers.
author_names = []

[ranking]
# How to order papers within a topic, most important first. Tier and topic
# order below set the order across topics.
preferences = [
  "real systems with results over position papers",
  "general mechanisms over narrow point solutions",
  "anything that reads as an opening for the reader",
]

# Tiers, in display priority order. Exactly one tier must set catch_all = true:
# papers that match no topic land there and render terse (title + one line).
# This default is field-neutral: one tier for every topic, ordered by the
# reader context at curation time. Split topics into tiers (for example core
# and adjacent) when customizing for a field.
[[tiers]]
id = "topics"
title = "Systems"
description = "papers that match a topic"

[[tiers]]
id = "other"
title = "Other (skim only)"
description = "in-category papers that match no topic"
catch_all = true

# Topics, in match order: the first matching topic wins, so list specific
# topics before broad ones. Each topic belongs to one tier and has `patterns`;
# optional `exclude` patterns veto the topic (the paper falls through to later
# topics), for example:
#   exclude = ['jailbreak', 'prompt injection']

[[topics]]
label = "Memory systems & disaggregation"
tier = "topics"
patterns = [
  '\bCXL\b', 'persistent memory', '\bPMEM\b', '\bNVM\b', 'memory disaggregat',
  'disaggregated memory', 'far memory', 'tiered memory', 'memory tiering',
  'byte[\s-]?addressable', 'memory management', 'page (fault|table|migration)',
  'paging', 'swap', 'virtual memory', 'memory virtualization', '\bNUMA\b',
]

[[topics]]
label = "ML systems"
tier = "topics"
patterns = [
  'kv[\s-]?cache', 'kvcache', 'key[\s-]?value cache', 'attention cache',
  'prefix cach', 'paged attention', 'llm (serving|inference|memory|storage)',
  '\bvLLM\b', 'continuous batching', '(request|inference|token) schedul',
  'speculative decod', 'disaggregated (prefill|inference)',
  'serving (system|engine)', 'model (checkpoint|loading|parallel)',
  '(distributed|large[\s-]?scale) training', '\bRAG\b',
  'vector (store|storage|database|index|search)',
]

[[topics]]
label = "Storage & I/O stack"
tier = "topics"
patterns = [
  'io_uring', 'block (device|layer)', 'page cache', 'file ?system', '\bNVMe\b',
  '\bSSD\b', '\bflash\b', '\bFTL\b', '\bZNS\b', '\bSMR\b', '\bext4\b',
  '\bXFS\b', '\bF2FS\b', '\bI/?O (stack|path|scheduler|layer)', 'direct I/?O',
  '\bstorage\b', 'object storage', 'key[\s-]?value store', '\bKV store\b',
  'deduplicat', 'erasure cod', '\bRAID\b', 'tiered storage', 'caching',
  'cache (system|hierarchy)',
]

[[topics]]
label = "Storage engines & data formats"
tier = "topics"
patterns = [
  'storage engine', 'buffer (pool|manager|management)', '\bB[\+\-]?tree',
  'LSM[\s-]?tree', '\bWAL\b', 'write[\s-]?ahead log', 'on[\s-]?disk index',
  'columnar', 'data warehouse', '\bParquet\b', '\bIceberg\b', 'lakehouse',
  'data (lake|format)', 'checkpoint', 'recovery (log|manager)',
]

[[topics]]
label = "Databases: query & transactions"
tier = "topics"
patterns = [
  '\bdatabase', '\bdbms\b', '\bOLAP\b', '\bOLTP\b',
  '\bquery (optimiz|processing|engine|plan|execution)', '\bSQL\b',
  'transaction', '\bindex(ing|es)?\b', 'join (order|algorithm)',
  'cardinality estimat',
]

[[topics]]
label = "Distributed systems & consistency"
tier = "topics"
patterns = [
  'replicat', 'consensus', '\bRaft\b', '\bPaxos\b', 'quorum', 'linearizab',
  'atomic commit', '\b2PC\b', 'sharding',
  'partition(ing|ed) (data|store|table)', 'consistency (model|protocol)',
  'coordination service', '\bZooKeeper\b', 'fault[\s-]?toleran',
]

[[topics]]
label = "Data processing & streaming"
tier = "topics"
patterns = [
  'map[\s-]?reduce', '\bSpark\b', 'dataflow', 'stream processing',
  'batch processing', 'data (pipeline|processing) (system|framework)',
  'distributed (query|join|compute)',
]

[[topics]]
label = "Cloud & serverless"
tier = "topics"
patterns = [
  '\bcloud\b', 'serverless', '\bFaaS\b', 'datacenter', 'multi[\s-]?tenan',
  '\bS3\b', 'resource (allocation|management)',
]

[[topics]]
label = "Networking"
tier = "topics"
patterns = [
  '\bRDMA\b', 'SmartNIC', '\bDPU\b', 'network (stack|function)', '\bTCP\b',
  'interconnect', 'congestion control',
]

[[topics]]
label = "Architecture & accelerators"
tier = "topics"
patterns = [
  '\bFPGA\b', 'accelerat', '\bGPU\b', 'processor', 'microarchitect',
  'cache coherence', 'processing[\s-]in[\s-]memory', '\bPIM\b',
]

[[topics]]
label = "Performance & reliability"
tier = "topics"
patterns = [
  'benchmark', 'profil', 'tail latency', 'performance (model|analysis)',
  'failure', 'reliab', 'energy',
]
